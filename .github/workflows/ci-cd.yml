name: CI/CD

on:
  push:
    branches: [course-work]

env:
  REGISTRY: fixly-meow.ru:5000
  IMAGE_PREFIX: degree_manager
  DOCKER_BUILDKIT: 1

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: admin-service
            context: ./admin-service
            image: admin-service
          - service: auth-service
            context: ./auth-service
            image: auth-service
          - service: user-service
            context: ./user-service
            image: user-service
          - service: gateway-server
            context: ./gateway-server
            image: gateway-server
          - service: eureka-server
            context: ./eureka-server
            image: eureka-server
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          provenance: false
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.image }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.image }}:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.29.2'

      - name: Configure kubeconfig
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir -p ~/.kube
          echo "$KUBE_CONFIG_DATA" | base64 --decode > ~/.kube/config

      - name: Apply manifests
        run: |
          kubectl apply -f deployment/server-package/k8s/infra
          kubectl apply -f deployment/server-package/k8s/apps

      - name: Update deployment images
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          declare -A images=(
            [admin-service]="${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-admin-service"
            [auth-service]="${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-auth-service"
            [user-service]="${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-user-service"
            [gateway-server]="${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-gateway-server"
            [eureka-server]="${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-eureka-server"
          )
          for deploy in "${!images[@]}"; do
            kubectl set image deployment/$deploy $deploy="${images[$deploy]}:$SHA" --record
          done

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/admin-service
          kubectl rollout status deployment/auth-service
          kubectl rollout status deployment/user-service
          kubectl rollout status deployment/gateway-server
          kubectl rollout status deployment/eureka-server
