server {
    listen 443 ssl http2;
    server_name fixly-meow.ru;

    root /home/fixly/web/fixly-frontend;
    index index.html;

    ssl_certificate     /opt/registry/certs/certificate.crt;
    ssl_certificate_key /opt/registry/certs/certificate.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location ^~ /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host fixly-meow.ru:8092;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass https://fixly-meow.ru:8092/;
        break;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        try_files $uri =404;
        access_log off;
    }
}

